name: Build and Deploy Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Show Node & NPM versions (debug)
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web (Expo export)
        run: npm run build:web

      - name: Show build output (debug)
        run: |
          echo "Listing workspace root"
          ls -la
          echo "Listing dist"
          ls -la dist || true
          if [ -f dist/index.html ]; then head -n 40 dist/index.html; fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
